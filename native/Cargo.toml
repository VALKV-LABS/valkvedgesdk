[package]
name = "edgekv-native"
version = "0.1.0"
description = "Node.js bindings to the valkvedge library, for the local mode of @valkv/edgekv"
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
napi = { version = "3", default-features = false, features = ["napi6", "async"] }
napi-derive = "3"
# Re-pin when the library changes.
valkvedge = { git = "https://github.com/VALKV-LABS/libvalkvedge", rev = "0f591b32e51f96b0d5170df4d40ecae514bffcbe" }

[build-dependencies]
napi-build = "2"

[profile.release]
lto = true
strip = "symbols"
codegen-units = 1
