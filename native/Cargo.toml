[package]
name = "edgekv-native"
version = "0.1.0"
description = "Node.js bindings to the valkvedge library, for the local mode of @valkvlabs/edgekv"
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
napi = { version = "3", default-features = false, features = ["napi6", "async"] }
napi-derive = "3"
# Re-pin when the library changes.
tokio = { version = "1", features = ["sync", "macros"] }
valkvedge = { git = "https://github.com/VALKV-LABS/libvalkvedge", rev = "bfc93aa2f33ad36e3525e01b3eaf93c2dfdfdfc1" }

[build-dependencies]
napi-build = "2"

[profile.release]
lto = true
strip = "symbols"
codegen-units = 1
